services:
  - type: web
    name: mearco-assist
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_INTAKE_ENABLED
        value: '0'
      - key: PUBLIC_TRACKING_ENABLED
        value: '0'
